<ion-card class="MealCard" id="MealCard">
    <img style="width: 227px;height: 227px;" id="MealImage" src={{meal_image()}} alt={{meal_name()}} />
    <ion-card-header>
        <ion-card-title style="font-size: 14px;">{{meal_name()}}</ion-card-title>
        <ion-card-subtitle id="MealSubInfo">{{meal_area()}}  ·  {{meal_category()}}</ion-card-subtitle>
    </ion-card-header>
</ion-card>
